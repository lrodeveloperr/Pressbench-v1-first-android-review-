name: Build PressBench closed-test AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out approved source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PRESSBENCH_UPLOAD_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pressbench-upload-key.p12"
          chmod 600 "$RUNNER_TEMP/pressbench-upload-key.p12"

      - name: Build signed closed-test bundle
        shell: bash
        env:
          PRESSBENCH_KEYSTORE_PATH: ${{ runner.temp }}/pressbench-upload-key.p12
          PRESSBENCH_KEYSTORE_PASSWORD: ${{ secrets.PRESSBENCH_KEYSTORE_PASSWORD }}
          PRESSBENCH_KEY_ALIAS: ${{ secrets.PRESSBENCH_KEY_ALIAS }}
          PRESSBENCH_KEY_PASSWORD: ${{ secrets.PRESSBENCH_KEY_PASSWORD }}
          PRESSBENCH_ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
          PRESSBENCH_ADMOB_BANNER_ID: ca-app-pub-3940256099942544/9214589741
        run: ./gradlew clean bundleRelease

      - name: Verify bundle signature
        run: jarsigner -verify -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: PressBench-v16-closed-test-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Run release lint and print complete findings
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./gradlew lintRelease
          lint_status=$?
          report="app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt"
          if [ -f "$report" ]; then
            sed -n '1,260p' "$report"
          fi
          exit "$lint_status"

      - name: Upload release lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PressBench-v16-release-lint
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.sarif
            app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if-no-files-found: warn
          retention-days: 7
