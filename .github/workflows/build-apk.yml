name: Build PressBench APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android compile packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build installable debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Stage named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PressBench-v14-Native-Jetpack.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PressBench-v14-Native-Jetpack-APK
          path: PressBench-v14-Native-Jetpack.apk
          if-no-files-found: error
          retention-days: 30
